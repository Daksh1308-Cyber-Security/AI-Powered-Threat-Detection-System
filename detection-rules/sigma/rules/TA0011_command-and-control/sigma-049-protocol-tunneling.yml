title: Protocol Tunneling Detection
id: sigma-012-003
status: experimental
description: Detects protocol tunneling for C2 operations
references:
  - https://attack.mitre.org/techniques/T1572/
author: Threat Detection System
date: 2024/01/15
modified: 2024/01/15
tags:
  - attack.command_and_control
  - attack.t1572
logsource:
  category: network_connection
  product: any
detection:
  selection_ssh_tunnel:
    network.protocol: ssh
    destination.port: 22
    network.transport: tcp
    destination.ip|contains:
      - '192.168.'
      - '10.'
      - '172.16.'
    network.bytes_in|gte: 1000000
  selection_dns_tunnel:
    network.protocol: dns
    dns.question|contains:
      - 'dns2.'
      - 'tunnel.'
      - 'ddns.'
      - 'iodine.'
      - 'dnscat'
      - 'o-o.myaddr'
  selection_ttp_tunnel:
    network.protocol: tcp
    destination.port:
      - 80
      - 443
      - 8080
    network.bytes_in|gte: 10000000
    network.bytes_out|gte: 10000000
  selection_tor:
    destination.port:
      - 9001
      - 9030
      - 9040
      - 9050
      - 9051
      - 9150
      - 9160
      - 9151
      - 9100
  selection_proxy:
    network.protocol: http
    http.request.url|contains:
      - 'proxy'
      - 'tunnel'
      - 'socks'
      - 'socket'
      - 'relay'
  condition: selection_ssh_tunnel or selection_dns_tunnel or selection_ttp_tunnel or selection_tor or selection_proxy
falsepositives:
  - Legitimate SSH tunnelling
  - VPN services
  - Tor browser
level: high