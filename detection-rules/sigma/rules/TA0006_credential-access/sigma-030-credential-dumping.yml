title: OS Credential Dumping Detection
id: sigma-007-002
status: experimental
description: Detects attempts to dump OS credentials
references:
  - https://attack.mitre.org/techniques/T1003/
author: Threat Detection System
date: 2024/01/15
modified: 2024/01/15
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_lsass:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\rundll32.exe'
      - '\cscript.exe'
      - '\wscript.exe'
      - '\mimikatz.exe'
      - '\procdump.exe'
      - '\sqlmap.exe'
    CommandLine|contains:
      - 'lsass'
      - 'lsass.exe'
      - 'mimikatz'
      - 'sekurlsa::'
      - 'privilege::debug'
      - 'token::elevate'
      - 'crypto::certificates'
      - 'kerberos::'
      - 'dpapi::'
  selection_registry:
    Image|endswith:
      - '\reg.exe'
      - '\regedit.exe'
    CommandLine|contains:
      - 'save'
      - 'save HKLM'
      - 'SAM'
      - 'SYSTEM'
      - 'SECURITY'
  selection_sam_copy:
    Image|endswith:
      - '\xcopy.exe'
      - '\copy.exe'
      - '\esentutl.exe'
    CommandLine|contains:
      - 'sam'
      - 'SYSTEM'
      - 'security'
      - 'ntds.dit'
  selection_ntds:
    Image|endswith:
      - '\ntdsutil.exe'
      - '\vssadmin.exe'
      - '\wmic.exe'
    CommandLine|contains:
      - 'ntds.dit'
      - 'Active Directory'
      - 'instance'
      - 'shadowcopy'
  selection_windows_vault:
    Image|endswith:
      - '\vaultcmd.exe'
      - '\cmdkey.exe'
      - '\powershell.exe'
    CommandLine|contains:
      - '/list'
      - 'vault'
      - 'Credential Manager'
      - 'Get-StoredCredential'
      - 'Get-Credential'
  selection_python_tools:
    Image|endswith:
      - '/python'
      - '/python3'
    CommandLine|contains:
      - 'impacket'
      - 'secretsdump'
      - 'wmiexec'
      - 'smbexec'
      - 'psexec'
      - 'evil-winrm'
  condition: selection_lsass or selection_registry or selection_sam_copy or selection_ntds or selection_windows_vault or selection_python_tools
falsepositives:
  - Legitimate LSASS monitoring
  - Security tools
  - Password management software
level: critical