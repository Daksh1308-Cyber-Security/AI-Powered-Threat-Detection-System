title: Credentials from Stores Detection
id: sigma-007-004
status: experimental
description: Detects access to stored credentials
references:
  - https://attack.mitre.org/techniques/T1555/
author: Threat Detection System
date: 2024/01/15
modified: 2024/01/15
tags:
  - attack.credential_access
  - attack.t1555
logsource:
  category: process_creation
  product: any
detection:
  selection_browser_credentials:
    Image|endswith:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
      - '\iexplore.exe'
    CommandLine|contains:
      - '--remote-debugging'
      - '--headless'
      - '--dump'
      - '--password-store'
      - 'credential'
      - 'login data'
  selection_keychain:
    Image|endswith:
      - '/security'
      - '/keychain'
      - '/passwd'
      - '/gpg'
    CommandLine|contains:
      - 'dump-keychain'
      - 'find-generic-password'
      - 'find-internet-password'
      - 'export-p2k'
      - 'export-pk12'
  selection_windows_credential:
    Image|endswith:
      - '\vaultcmd.exe'
      - '\cmdkey.exe'
      - '\rundll32.exe'
      - '\cryptext.dll'
      - '\wiaarpc.dll'
      - '\vaultsvc.dll'
    CommandLine|contains:
      - 'vault'
      - 'Credential Manager'
      - 'Get-StoredCredential'
      - '/list'
      - '/create'
      - '/delete'
  selection_windows_wifi:
    Image|endswith:
      - '\netsh.exe'
    CommandLine|contains:
      - 'wlan show profile'
      - 'key=clear'
  selection_windows_browser:
    Image|endswith:
      - '\chrome.exe'
      - '\firefox.exe'
    CommandLine|contains:
      - '--decrypt'
      - '--export'
      - '--dump-credentials'
      - 'credentials'
  condition: selection_browser_credentials or selection_keychain or selection_windows_credential or selection_windows_wifi or selection_windows_browser
falsepositives:
  - Legitimate credential access
  - Password managers
  - Browser maintenance
level: high