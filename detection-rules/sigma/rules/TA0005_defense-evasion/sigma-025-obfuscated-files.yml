title: Obfuscated Files or Information Detection
id: sigma-006-002
status: experimental
description: Detects obfuscated files or information that may indicate malicious activity
references:
  - https://attack.mitre.org/techniques/T1027/
author: Threat Detection System
date: 2024/01/15
modified: 2024/01/15
tags:
  - attack.defense_evasion
  - attack.t1027
logsource:
  category: process_creation
  product: any
detection:
  selection_encoded:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '/bash'
      - '/sh'
      - '/zsh'
    CommandLine|contains:
      - 'FromBase64String'
      - 'Base64'
      - '-enc'
      - '-encodedCommand'
      - '--$'
      - 'base64'
      - 'echo base64'
      - 'openssl base64'
      - 'certutil -decode'
      - 'base64 -d'
      - 'base64 --decode'
  selection_gzip:
    Image|endswith:
      - '/gzip'
      - '/gunzip'
      - '/tar'
      - '/zip'
      - '/unzip'
      - '/tar.gz'
  selection_xor:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'XOR'
      - '-xor'
      - 'bxor'
      - '^ '
  selection_pyobfuscate:
    Image|endswith:
      - '/python'
      - '/python3'
      - '/python2'
    CommandLine|contains:
      - 'base64.b64decode'
      - 'urllib.parse.unquote'
      - 'codecs.encode'
      - 'rot13'
      - 'zlib.decompress'
  condition: selection_encoded or selection_gzip or selection_xor or selection_pyobfuscate
falsepositives:
  - Legitimate file compression
  - Software packaging
  - Development tools
level: high