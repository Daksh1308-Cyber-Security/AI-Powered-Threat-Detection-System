# ===========================================
# Logstash Pipeline: Linux Syslog
# AI-Powered Threat Detection System
# ===========================================

input {
  beats {
    port => 5044
    type => "linux"
  }
  
  syslog {
    port => 5514
    type => "syslog"
  }
}

filter {
  # Parse syslog messages
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    }
    
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      target => "@timestamp"
    }
    
    mutate {
      add_field => { "agent.hostname" => "%{syslog_hostname}" }
      add_field => { "agent.type" => "linux" }
    }
  }
  
  # Parse auth.log entries
  if [syslog_program] == "sshd" or [syslog_program] == "sudo" or [syslog_program] == "su" {
    grok {
      match => { "syslog_message" => "%{GREEDYDATA:auth_message}" }
    }
    
    # Extract authentication details
    if "Failed password" in [auth_message] {
      grok {
        match => { "auth_message" => "Failed password for (invalid user )?%{USER:user.name} from %{IP:source.ip} port %{INT:source.port} ssh2" }
      }
      mutate {
        add_field => { "event.outcome" => "failure" }
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "tags" => "auth_failure" }
      }
    }
    
    if "Accepted password" in [auth_message] or "Accepted publickey" in [auth_message] {
      grok {
        match => { "auth_message" => "Accepted (password|publickey) for %{USER:user.name} from %{IP:source.ip} port %{INT:source.port} ssh2" }
      }
      mutate {
        add_field => { "event.outcome" => "success" }
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "tags" => "auth_success" }
      }
    }
    
    if "sudo:" in [syslog_program] {
      grok {
        match => { "auth_message" => "%{USER:user.name} : TTY=%{DATA:tty} ; PWD=%{DATA:working_directory} ; USER=%{USER:target_user} ; COMMAND=%{GREEDYDATA:command}" }
      }
      mutate {
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "tags" => "sudo_execution" }
      }
    }
  }
  
  # Parse cron jobs
  if [syslog_program] == "CRON" {
    grok {
      match => { "syslog_message" => "\(%{USER:user.name}\) %{GREEDYDATA:cron_command}" }
    }
    mutate {
      add_field => { "event.category" => "scheduled_task" }
      add_field => { "event.kind" => "event" }
      add_field => { "event.type" => "start" }
      add_field => { "tags" => "cron_execution" }
    }
  }
  
  # Parse kernel messages
  if [syslog_program] == "kernel" {
    grok {
      match => { "syslog_message" => "\[%{GREEDYDATA:kernel_message}" }
    }
    
    if "UFW BLOCK" in [kernel_message] {
      grok {
        match => { "kernel_message" => "UFW BLOCK IN=%{WORD:network_interface} SRC=%{IP:source.ip} DST=%{IP:destination.ip} PROTO=%{WORD:network.transport} SPT=%{INT:source.port} DPT=%{INT:destination.port}" }
      }
      mutate {
        add_field => { "event.category" => "firewall" }
        add_field => { "event.outcome" => "blocked" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "tags" => "firewall_block" }
      }
    }
  }
  
  # Parse systemd service events
  if [syslog_program] == "systemd" {
    if "Started" in [syslog_message] or "Stopped" in [syslog_message] {
      grok {
        match => { "syslog_message" => "(Started|Stopped) %{GREEDYDATA:service_name}" }
      }
      mutate {
        add_field => { "event.category" => "service" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "tags" => "service_change" }
      }
    }
  }
  
  # Add MITRE ATT&CK mapping for known patterns
  if "auth_failure" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "credential_access" }
      add_field => { "mitre.technique" => "brute_force" }
      add_field => { "mitre.technique_id" => "T1110" }
    }
  }
  
  if "firewall_block" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "initial_access" }
      add_field => { "mitre.technique" => "external_remote_services" }
      add_field => { "mitre.technique_id" => "T1133" }
    }
  }
  
  # Add agent information
  mutate {
    add_field => { "agent.type" => "linux" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "linux-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
