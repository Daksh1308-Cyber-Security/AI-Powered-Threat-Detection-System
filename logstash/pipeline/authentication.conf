# ===========================================
# Logstash Pipeline: Authentication Logs
# AI-Powered Threat Detection System
# ===========================================

input {
  beats {
    port => 5046
    type => "authentication"
  }
}

filter {
  # Parse Linux authentication logs
  if [agent.type] == "linux" or [type] == "linux" {
    # SSH Authentication
    if "sshd" in [syslog_program] or [process][name] == "sshd" {
      grok {
        match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} sshd\[%{INT:process.pid}\]: %{GREEDYDATA:ssh_message}" }
      }
      
      # Failed password
      if "Failed password" in [ssh_message] {
        grok {
          match => { "ssh_message" => "Failed password for (invalid user )?%{USER:user.name} from %{IP:source.ip} port %{INT:source.port} ssh2" }
        }
        mutate {
          add_field => { "event.outcome" => "failure" }
          add_field => { "event.category" => "authentication" }
          add_field => { "event.kind" => "event" }
          add_field => { "event.type" => "info" }
          add_field => { "event.module" => "sshd" }
          add_field => { "tags" => ["auth_failure", "brute_force"] }
          add_field => { "mitre.tactic" => "credential_access" }
          add_field => { "mitre.technique" => "brute_force" }
          add_field => { "mitre.technique_id" => "T1110" }
        }
      }
      
      # Successful password
      if "Accepted password" in [ssh_message] or "Accepted publickey" in [ssh_message] {
        grok {
          match => { "ssh_message" => "Accepted (password|publickey) for %{USER:user.name} from %{IP:source.ip} port %{INT:source.port} ssh2" }
        }
        mutate {
          add_field => { "event.outcome" => "success" }
          add_field => { "event.category" => "authentication" }
          add_field => { "event.kind" => "event" }
          add_field => { "event.type" => "info" }
          add_field => { "event.module" => "sshd" }
          add_field => { "tags" => "auth_success" }
        }
      }
      
      # Invalid user
      if "Invalid user" in [ssh_message] {
        grok {
          match => { "ssh_message" => "Invalid user %{USER:user.name} from %{IP:source.ip} port %{INT:source.port}" }
        }
        mutate {
          add_field => { "event.outcome" => "failure" }
          add_field => { "event.category" => "authentication" }
          add_field => { "event.kind" => "event" }
          add_field => { "event.type" => "info" }
          add_field => { "event.module" => "sshd" }
          add_field => { "tags" => ["auth_failure", "invalid_user"] }
          add_field => { "mitre.tactic" => "credential_access" }
          add_field => { "mitre.technique" => "brute_force" }
          add_field => { "mitre.technique_id" => "T1110" }
        }
      }
      
      # Connection closed
      if "Connection closed" in [ssh_message] {
        grok {
          match => { "ssh_message" => "Connection closed by authenticating user %{USER:user.name} %{IP:source.ip} port %{INT:source.port} ssh2 \[%{GREEDYDATA:disconnect_reason}\]" }
        }
        mutate {
          add_field => { "event.category" => "authentication" }
          add_field => { "event.kind" => "event" }
          add_field => { "event.type" => "info" }
          add_field => { "event.module" => "sshd" }
          add_field => { "tags" => "auth_disconnect" }
        }
      }
    }
    
    # Sudo Authentication
    if "sudo" in [syslog_program] or [process][name] == "sudo" {
      grok {
        match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} sudo:\s+%{USER:user.name}\s*:\s*TTY=%{DATA:tty}\s*;\s*PWD=%{DATA:working_directory}\s*;\s*USER=%{USER:target_user}\s*;\s*COMMAND=%{GREEDYDATA:command}" }
      }
      mutate {
        add_field => { "event.outcome" => "success" }
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "sudo" }
        add_field => { "tags" => "sudo_execution" }
        add_field => { "mitre.tactic" => "privilege_escalation" }
        add_field => { "mitre.technique" => "abuse_elevation_control_mechanism" }
        add_field => { "mitre.technique_id" => "T1548" }
      }
    }
  }
  
  # Parse Windows authentication logs
  if [agent.type] == "windows" or [type] == "windows" {
    # Logon Events (4624)
    if [winlog][event_id] == 4624 {
      mutate {
        add_field => { "event.outcome" => "success" }
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "security" }
        add_field => { "tags" => "auth_success" }
      }
      
      # Extract logon type
      if [winlog][event_data][LogonType] == "10" {
        mutate {
          add_field => { "tags" => "remote_logon" }
          add_field => { "mitre.tactic" => "lateral_movement" }
          add_field => { "mitre.technique" => "remote_services" }
          add_field => { "mitre.technique_id" => "T1021" }
        }
      }
    }
    
    # Failed Logon Events (4625)
    if [winlog][event_id] == 4625 {
      mutate {
        add_field => { "event.outcome" => "failure" }
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "security" }
        add_field => { "tags" => ["auth_failure", "brute_force"] }
        add_field => { "mitre.tactic" => "credential_access" }
        add_field => { "mitre.technique" => "brute_force" }
        add_field => { "mitre.technique_id" => "T1110" }
      }
    }
    
    # Account Lockout (4740)
    if [winlog][event_id] == 4740 {
      mutate {
        add_field => { "event.outcome" => "failure" }
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "security" }
        add_field => { "tags" => "account_lockout" }
        add_field => { "mitre.tactic" => "credential_access" }
        add_field => { "mitre.technique" => "brute_force" }
        add_field => { "mitre.technique_id" => "T1110" }
      }
    }
    
    # Password Change (4723, 4724)
    if [winlog][event_id] == 4723 or [winlog][event_id] == 4724 {
      mutate {
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "change" }
        add_field => { "event.module" => "security" }
        add_field => { "tags" => "password_change" }
      }
    }
  }
  
  # Add source/destination fields for unified schema
  if [source][ip] {
    mutate {
      add_field => { "source.ip" => "%{source.ip}" }
    }
  }
  
  if [destination][ip] {
    mutate {
      add_field => { "destination.ip" => "%{destination.ip}" }
    }
  }
  
  # Add agent information
  mutate {
    add_field => { "agent.type" => "authentication" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "authentication-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
