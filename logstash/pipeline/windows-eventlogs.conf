# ===========================================
# Logstash Pipeline: Windows Event Logs
# AI-Powered Threat Detection System
# ===========================================

input {
  beats {
    port => 5045
    type => "windows"
  }
}

filter {
  # Parse Windows Security Event Logs
  if [winlog][channel] == "Security" {
    # Logon Events (4624, 4625)
    if [winlog][event_id] == 4624 or [winlog][event_id] == 4625 {
      mutate {
        add_field => { "event.category" => "authentication" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
      }
      
      if [winlog][event_id] == 4624 {
        mutate {
          add_field => { "event.outcome" => "success" }
          add_field => { "tags" => "auth_success" }
        }
      }
      
      if [winlog][event_id] == 4625 {
        mutate {
          add_field => { "event.outcome" => "failure" }
          add_field => { "tags" => "auth_failure" }
        }
      }
    }
    
    # Process Creation (4688)
    if [winlog][event_id] == 4688 {
      mutate {
        add_field => { "event.category" => "process" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "start" }
        add_field => { "tags" => "process_creation" }
      }
    }
    
    # Account Creation (4720)
    if [winlog][event_id] == 4720 {
      mutate {
        add_field => { "event.category" => "iam" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "creation" }
        add_field => { "tags" => "account_creation" }
      }
    }
    
    # Account Deletion (4726)
    if [winlog][event_id] == 4726 {
      mutate {
        add_field => { "event.category" => "iam" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "deletion" }
        add_field => { "tags" => "account_deletion" }
      }
    }
    
    # Group Membership Changes (4728, 4732, 4756)
    if [winlog][event_id] == 4728 or [winlog][event_id] == 4732 or [winlog][event_id] == 4756 {
      mutate {
        add_field => { "event.category" => "iam" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "change" }
        add_field => { "tags" => "group_membership_change" }
      }
    }
    
    # Service Installation (4697)
    if [winlog][event_id] == 4697 {
      mutate {
        add_field => { "event.category" => "service" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "creation" }
        add_field => { "tags" => "service_installation" }
      }
    }
    
    # Audit Policy Changes (4719, 4902, 4904, 4905, 4906, 4907)
    if [winlog][event_id] =~ /^(4719|4902|4904|4905|4906|4907)$/ {
      mutate {
        add_field => { "event.category" => "configuration" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "change" }
        add_field => { "tags" => "audit_policy_change" }
      }
    }
  }
  
  # Parse Windows System Event Logs
  if [winlog][channel] == "System" {
    # Service State Changes (7034, 7035, 7036, 7040, 7045)
    if [winlog][event_id] =~ /^(7034|7035|7036|7040|7045)$/ {
      mutate {
        add_field => { "event.category" => "service" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "change" }
        add_field => { "tags" => "service_state_change" }
      }
    }
    
    # New Service Installed (7045)
    if [winlog][event_id] == 7045 {
      mutate {
        add_field => { "event.type" => "creation" }
        add_field => { "tags" => "new_service_installation" }
      }
    }
  }
  
  # Parse Windows PowerShell Logs
  if [winlog][channel] == "Microsoft-Windows-PowerShell/Operational" {
    # Script Block Logging (4104)
    if [winlog][event_id] == 4104 {
      mutate {
        add_field => { "event.category" => "process" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "tags" => "powershell_script_block" }
      }
      
      # Detect suspicious PowerShell commands
      if "Invoke-Expression" in [winlog][message] or "IEX" in [winlog][message] {
        mutate {
          add_field => { "tags" => "suspicious_powershell" }
          add_field => { "mitre.tactic" => "execution" }
          add_field => { "mitre.technique" => "command_and_scripting_interpreter" }
          add_field => { "mitre.technique_id" => "T1059" }
        }
      }
      
      if "DownloadString" in [winlog][message] or "DownloadFile" in [winlog][message] or "Invoke-WebRequest" in [winlog][message] {
        mutate {
          add_field => { "tags" => "powershell_download_cradle" }
          add_field => { "mitre.tactic" => "execution" }
          add_field => { "mitre.technique" => "command_and_scripting_interpreter" }
          add_field => { "mitre.technique_id" => "T1059.001" }
        }
      }
      
      if "Add-MpPreference" in [winlog][message] or "Set-MpPreference" in [winlog][message] {
        mutate {
          add_field => { "tags" => "powershell_defender_bypass" }
          add_field => { "mitre.tactic" => "defense_evasion" }
          add_field => { "mitre.technique" => "impair_defenses" }
          add_field => { "mitre.technique_id" => "T1562" }
        }
      }
    }
  }
  
  # Parse Windows Sysmon Logs
  if [winlog][channel] == "Microsoft-Windows-Sysmon/Operational" {
    # Process Create (1)
    if [winlog][event_id] == 1 {
      mutate {
        add_field => { "event.category" => "process" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "start" }
        add_field => { "tags" => "sysmon_process_create" }
      }
    }
    
    # Network Connection (3)
    if [winlog][event_id] == 3 {
      mutate {
        add_field => { "event.category" => "network" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "connection" }
        add_field => { "tags" => "sysmon_network_connection" }
      }
    }
    
    # File Create (11)
    if [winlog][event_id] == 11 {
      mutate {
        add_field => { "event.category" => "file" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "creation" }
        add_field => { "tags" => "sysmon_file_create" }
      }
    }
    
    # Registry Value Set (13)
    if [winlog][event_id] == 13 {
      mutate {
        add_field => { "event.category" => "registry" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "change" }
        add_field => { "tags" => "sysmon_registry_value_set" }
      }
    }
  }
  
  # Add MITRE ATT&CK mapping for known patterns
  if "auth_failure" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "credential_access" }
      add_field => { "mitre.technique" => "brute_force" }
      add_field => { "mitre.technique_id" => "T1110" }
    }
  }
  
  if "account_creation" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "persistence" }
      add_field => { "mitre.technique" => "create_account" }
      add_field => { "mitre.technique_id" => "T1136" }
    }
  }
  
  if "service_installation" in [tags] or "new_service_installation" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "persistence" }
      add_field => { "mitre.technique" => "create_or_modify_system_process" }
      add_field => { "mitre.technique_id" => "T1543" }
    }
  }
  
  if "audit_policy_change" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "defense_evasion" }
      add_field => { "mitre.technique" => "impair_defenses" }
      add_field => { "mitre.technique_id" => "T1562" }
    }
  }
  
  if "powershell_download_cradle" in [tags] {
    mutate {
      add_field => { "mitre.tactic" => "execution" }
      add_field => { "mitre.technique" => "powershell" }
      add_field => { "mitre.technique_id" => "T1059.001" }
    }
  }
  
  # Add agent information
  mutate {
    add_field => { "agent.type" => "windows" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "windows-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
