# ===========================================
# Logstash Pipeline: Network Logs
# AI-Powered Threat Detection System
# ===========================================

input {
  beats {
    port => 5047
    type => "network"
  }
  
  tcp {
    port => 5515
    type => "suricata"
    codec => json
  }
}

filter {
  # Parse Suricata/EVE JSON logs
  if [type] == "suricata" {
    # HTTP Events
    if [event_type] == "http" {
      mutate {
        add_field => { "event.category" => "network" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "suricata" }
        add_field => { "tags" => "suricata_http" }
      }
      
      # Detect suspicious HTTP activity
      if [http][http_method] == "POST" and [http][status] == 200 {
        mutate {
          add_field => { "tags" => "http_post_success" }
        }
      }
      
      # Detect web shell communication
      if [http][url] =~ /\.(php|asp|aspx|jsp)$/ {
        mutate {
          add_field => { "tags" => "potential_webshell" }
          add_field => { "mitre.tactic" => "command_and_control" }
          add_field => { "mitre.technique" => "application_layer_protocol" }
          add_field => { "mitre.technique_id" => "T1071" }
        }
      }
    }
    
    # DNS Events
    if [event_type] == "dns" {
      mutate {
        add_field => { "event.category" => "network" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "suricata" }
        add_field => { "tags" => "suricata_dns" }
      }
      
      # Detect DNS tunneling
      if [dns][rrname] =~ /^\w{20,}\./ {
        mutate {
          add_field => { "tags" => "dns_tunneling" }
          add_field => { "mitre.tactic" => "command_and_control" }
          add_field => { "mitre.technique" => "protocol_tunneling" }
          add_field => { "mitre.technique_id" => "T1572" }
        }
      }
      
      # Detect known malicious domains
      if [dns][rrname] =~ /(malware|c2|command)/ {
        mutate {
          add_field => { "tags" => "malicious_domain" }
          add_field => { "mitre.tactic" => "command_and_control" }
          add_field => { "mitre.technique" => "application_layer_protocol" }
          add_field => { "mitre.technique_id" => "T1071" }
        }
      }
    }
    
    # TLS Events
    if [event_type] == "tls" {
      mutate {
        add_field => { "event.category" => "network" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "suricata" }
        add_field => { "tags" => "suricata_tls" }
      }
      
      # Detect self-signed certificates
      if [tls][sni] and not [tls][issuerdn] {
        mutate {
          add_field => { "tags" => "self_signed_cert" }
          add_field => { "mitre.tactic" => "command_and_control" }
          add_field => { "mitre.technique" => "application_layer_protocol" }
          add_field => { "mitre.technique_id" => "T1071" }
        }
      }
    }
    
    # Alert Events
    if [event_type] == "alert" {
      mutate {
        add_field => { "event.category" => "intrusion_detection" }
        add_field => { "event.kind" => "alert" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "suricata" }
        add_field => { "tags" => "suricata_alert" }
      }
      
      # Map Suricata rules to MITRE
      if [alert][category] =~ /shellcode/i {
        mutate {
          add_field => { "mitre.tactic" => "execution" }
          add_field => { "mitre.technique" => "exploitation_for_client_execution" }
          add_field => { "mitre.technique_id" => "T1203" }
        }
      }
      
      if [alert][category] =~ /trojan/i or [alert][category] =~ /malware/i {
        mutate {
          add_field => { "mitre.tactic" => "command_and_control" }
          add_field => { "mitre.technique" => "ingress_tool_transfer" }
          add_field => { "mitre.technique_id" => "T1105" }
        }
      }
    }
    
    # Flow Events
    if [event_type] == "flow" {
      mutate {
        add_field => { "event.category" => "network" }
        add_field => { "event.kind" => "event" }
        add_field => { "event.type" => "info" }
        add_field => { "event.module" => "suricata" }
        add_field => { "tags" => "suricata_flow" }
      }
      
      # Detect large data transfers
      if [flow][bytes_toserver] > 10000000 {
        mutate {
          add_field => { "tags" => "large_data_transfer" }
          add_field => { "mitre.tactic" => "exfiltration" }
          add_field => { "mitre.technique" => "exfiltration_over_alternative_protocol" }
          add_field => { "mitre.technique_id" => "T1048" }
        }
      }
    }
  }
  
  # Parse network flow data
  if [type] == "network" {
    mutate {
      add_field => { "event.category" => "network" }
      add_field => { "event.kind" => "event" }
      add_field => { "event.type" => "info" }
      add_field => { "event.module" => "network" }
      add_field => { "tags" => "network_flow" }
    }
    
    # Detect port scanning
    if [network][packets] > 100 and [destination][port] != 80 and [destination][port] != 443 {
      mutate {
        add_field => { "tags" => "port_scan" }
        add_field => { "mitre.tactic" => "discovery" }
        add_field => { "mitre.technique" => "network_service_scanning" }
        add_field => { "mitre.technique_id" => "T1046" }
      }
    }
  }
  
  # Add agent information
  mutate {
    add_field => { "agent.type" => "network" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "network-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
